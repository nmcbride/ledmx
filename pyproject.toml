[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledmx"
version = "0.1.0"
description = "Animation and video toolkit for Framework 16 LED matrix modules"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5", "numpy>=1.24", "pillow>=10.0"]

[project.scripts]
ledmx = "ledmx.cli:main"

[tool.setuptools.packages.find]
include = ["ledmx*"]
